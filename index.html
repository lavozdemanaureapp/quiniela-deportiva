<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
<link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Deportiva</title>
    <!-- Icono para la web / acceso directo móvil -->
    <link rel="icon" type="image/png" href="icono-balon.png">
    <style>
        :root {
            --primary-color: #1b4d3e;
            --accent-color: #ffcc00;
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            font-size: 16px; /* Letra base grande para móviles */
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            font-size: 0.95rem;
            color: #666;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .match-header {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 500;
        }

        .team-icon {
            width: 30px;
            height: 30px;
            background: #ddd;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        input.score-input {
            width: 55px;
            height: 45px;
            text-align: center;
            font-size: 1.2rem;
            border: 2px solid #ccc;
            border-radius: 8px;
            outline: none;
            background: #fafafa;
        }

        input.score-input:focus {
            border-color: var(--primary-color);
            background: #fff;
        }

        .btn-submit {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(27, 77, 62, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚽ Quiniela Móvil</h1>
        <p>Jornada Actual • Ingresa tus marcadores</p>
    </header>

    <form id="quinielaForm">
        <!-- Partido 1 -->
        <div class="match-card">
            <div class="match-header">Sábado • 4:00 PM</div>
            <div class="team-row">
                <div class="team-info">
                    <div class="team-icon">DT</div>
                    <span>Deportivo Táchira</span>
                </div>
                <input type="number" class="score-input" min="0" max="9" required placeholder="0">
            </div>
            <div class="team-row">
                <div class="team-info">
                    <div class="team-icon">CFC</div>
                    <span>Caracas FC</span>
                </div>
                <input type="number" class="score-input" min="0" max="9" required placeholder="0">
            </div>
        </div>

        <!-- Partido 2 -->
        <div class="match-card">
            <div class="match-header">Sábado • 7:00 PM</div>
            <div class="team-row">
                <div class="team-info">
                    <div class="team-icon">EQU</div>
                    <span>Equipo Local</span>
                </div>
                <input type="number" class="score-input" min="0" max="9" required placeholder="0">
            </div>
            <div class="team-row">
                <div class="team-info">
                    <div class="team-icon">EQU</div>
                    <span>Equipo Visitante</span>
                </div>
                <input type="number" class="score-input" min="0" max="9" required placeholder="0">
            </div>
        </div>

        <button type="submit" class="btn-submit">Enviar Pronósticos</button>
    </form>

</body>
</html>
